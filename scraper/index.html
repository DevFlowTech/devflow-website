
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vassu Infotech Data Scraper</title>
  <meta name="robots" content="noindex, follow" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0e0e0e;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1c1c1c;
      padding: 20px;
      font-size: 1.8em;
      color: #00bcd4;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    main {
      max-width: 900px;
      margin: 40px auto;
      background: #181818;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    input {
      width: 40%;
      padding: 10px;
      margin: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      background: #00bcd4;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }
    button:hover {
      background: #0097a7;
    }
    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #222;
    }
    tr:nth-child(even) {
      background: #141414;
    }
  </style>
</head>
<body>
  <header>⚙️ Vassu Infotech Data Scraper</header>
  <main>
    <h2>Find Business Data Instantly</h2>
    <p>Enter a keyword and location to scrape business details</p>
    <div>
      <input type="text" id="keyword" placeholder="Enter keyword e.g. Manufacturer">
      <input type="text" id="location" placeholder="Enter location e.g. Jaipur">
      <button onclick="scrape()">Scrape</button>
    </div>
    <table id="results" style="display:none;">
      <thead>
        <tr>
          <th>Business Name</th>
          <th>Email</th>
          <th>Website</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    function scrape() {
      const keyword = document.getElementById('keyword').value.trim();
      const location = document.getElementById('location').value.trim();
      if (!keyword || !location) {
        alert("Please enter both keyword and location.");
        return;
      }
      const resultsTable = document.getElementById('results');
      const tbody = resultsTable.querySelector('tbody');
      resultsTable.style.display = 'table';
      tbody.innerHTML = "<tr><td colspan='3'>Fetching data...</td></tr>";
      
      // Simulated results (replace with backend API call when ready)
      setTimeout(() => {
        tbody.innerHTML = `
          <tr><td>ABC Manufacturing</td><td>abc@company.com</td><td>abcmanufacturing.com</td></tr>
          <tr><td>XYZ Enterprises</td><td>info@xyz.com</td><td>xyzenterprises.com</td></tr>
        `;
      }, 1500);
    }
  </script>
</body>
</html>
